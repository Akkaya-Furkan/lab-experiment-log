<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Lab experiment log{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('index') }}">◉ Lab experiment log</a>
{% if g.user %}<nav><span>{{ g.user.username }}</span><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="secondary">Sign out</button></form></nav>{% endif %}</header>
<main>{% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
{% block content %}{% endblock %}</main>
<footer>Local experiment notebook · Keep units explicit. Demo records are synthetic.</footer></body></html>
