[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-experiment-log"
version = "0.1.0"
description = "A local, owner-isolated experiment notebook with SQLite persistence"
requires-python = ">=3.11"
dependencies = ["Flask==3.1.2"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["lablog*"]

[tool.setuptools.package-data]
lablog = ["schema.sql", "templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
